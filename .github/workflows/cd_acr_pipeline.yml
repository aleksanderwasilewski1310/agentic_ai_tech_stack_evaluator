name: CD - Azure Container Registry Deployment

# This workflow only runs when code is pushed to the 'main' branch
# ensuring that only verified code reaches the container registry.
on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-acr:
    name: Build and Push to Azure
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository (v6.0.2)
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.1.7

      # Step 2: Authenticate with Azure Container Registry
      # Uses GitHub Secrets to keep your ACR credentials private
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@15c4aadf093404726ab2ff205b2cdd33fa6d054c
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Step 3: Set up Docker Buildx
      # Necessary for efficient caching and advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # Step 4: Build and Push the Docker image
      # The image is tagged as 'latest' for general use and with the commit SHA for versioning
      - name: Build and push image to ACR
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v. 7.1.0
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/agentic-ai-evaluator:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/agentic-ai-evaluator:${{ github.sha }}
          # Optimized caching using GitHub Actions cache storage
          cache-from: type=gha
          cache-to: type=gha,mode=max
