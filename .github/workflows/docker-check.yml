name: Docker Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-check:
    name: Build and Validate Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4 # codacy:ignore

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # codacy:ignore

      # 3. Build the Docker image
      - name: Build Docker image
        uses: docker/build-push-action@v5 # codacy:ignore
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agent-evaluator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
