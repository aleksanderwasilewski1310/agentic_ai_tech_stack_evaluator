name: Docker Build Check

# Trigger: Run on every push or pull request to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-check:
    name: Build and Validate Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx (extended build capabilities)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Build the Docker image
      # This step verifies that the Dockerfile is valid and all dependencies can be installed
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Only testing the build process, not pushing to a registry yet
          tags: agent-evaluator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
