name: Docker Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-check:
    name: Build and Validate Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository (v4.1.7)
      - name: Checkout repository
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      # 2. Set up Docker Buildx (v3.5.0)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@aaae598d519c1213af502916b6c6bd3839e083a2 # v3.5.0

      # 3. Build the Docker image (v6.5.0)
      - name: Build Docker image
        uses: docker/build-push-action@5176d81f87c2b0f169c7cdbf73090c5800d0c18e # v6.5.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agent-evaluator:test
